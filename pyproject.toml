[project]
name = "trading"
version = "0.1.0"
description = "Autonomes BTC-Trading-System auf Bybit mit KI-gesteuerter Strategieforschung"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "websockets>=12.0",
]

[project.optional-dependencies]
research = ["anthropic>=0.116"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
news = ["feedparser>=6.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.scripts]
trading = "cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "data", "strategy", "backtest", "execution", "research", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "network: Test braucht echte Bybit-Verbindung (wird in CI/Sandbox uebersprungen)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
# Typer erwartet ``typer.Option(...)`` als Default-Wert - das ist die
# vorgesehene Verwendung, nicht der Fehler, den B008 sonst meint.
"cli.py" = ["B008"]
